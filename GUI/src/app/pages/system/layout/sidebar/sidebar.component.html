<div class="h-100">
  <ul class="sidebar-nav">
    <li class="sidebar-header">
      Home
    </li>
    <li class="sidebar-sub-item" routerLinkActive="active">
    <a routerLink="/dashboard" class="sidebar-link">
      <fa-icon [icon]="icons.faHouse" style="width: 20px;"></fa-icon>
      Dashboard
    </a>
    </li>
  </ul>
  <ul class="sidebar-nav">
    <li class="sidebar-item"
        *ngFor="let menu of (accountService.currentGroupPermission$ | async) ?? []"
    >
      <a href="#" class="sidebar-link"
         [ngClass]="{'collapsed': !hasActiveSubmenu(menu)}"
         data-bs-toggle="collapse"
         [attr.data-bs-target]="menu.name ? '#pages-' + createSlug(menu.name) : ''"
         [attr.aria-expanded]="hasActiveSubmenu(menu) ? 'true' : 'false'"
         aria-controls="pages">
        <fa-icon [icon]="getIcon(menu.icon)"></fa-icon>
        {{menu.name}}
      </a>
      <ul id="pages-{{createSlug(menu.name)}}"
          class="sidebar-dropdown list-unstyled collapse"
          [ngClass]="{'show': hasActiveSubmenu(menu)}"
          data-bs-parent="#sidebar">
        <ng-container *ngFor="let submenu of (accountService.currentMenu$ | async) ?? []">
          <li class="sidebar-sub-item"
              *ngIf="submenu.groupPermissionId === menu.id"
              routerLinkActive="active">
            <a routerLink="/{{submenu.controller}}" class="sidebar-link">
              <fa-icon [icon]="getIcon(submenu.icon)" style="width: 20px;"></fa-icon>
              {{submenu.name}}
            </a>
          </li>
        </ng-container>
      </ul>
    </li>
  </ul>
</div>
