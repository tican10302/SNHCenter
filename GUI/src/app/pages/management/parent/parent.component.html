<ng-container *ngIf="permission?.isView">
    <div>
        <div class="title">
            <h2 class="title-content">
                Parent
            </h2>
        </div>
        <div class="content">
            <div class="">
                <div class="row">
                    <div class="col-md-6">
                    </div>
                </div>
                <p-table #dataTable
                         dataKey="id"
                         [columns]="cols"
                         [value]="tableData"
                         [(selection)]="selectedListData"
                         [paginator]="true"
                         [tableStyle]="{ 'min-width': '50rem' }"
                         [resizableColumns]="true"
                         [rows]="10"
                         [rowsPerPageOptions]="[10, 15, 20]"
                         [totalRecords]="totalRecords"
                         [lazy]="true"
                         [(first)]="getListPagingRequest.offset"
                         showGridlines
                         stripedRows
                         (onPage)="loadData($event)">
                    <ng-template pTemplate="caption">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p-button *ngIf="permission?.isView" (onClick)="showViewDialog()" icon="pi pi-eye" label="View" severity="info" class="me-md-2" />
                                <p-button *ngIf="permission?.isAdd" (onClick)="showAddDialog()" icon="pi pi-plus" label="Add" severity="success" class="me-md-2" />
                                <p-button *ngIf="permission?.isEdit" (onClick)="showEditDialog()" icon="pi pi-pencil" label="Edit" severity="warn" class="me-md-2" />
                                <p-button *ngIf="permission?.isDelete" (onClick)="confirmDelete($event)" icon="pi pi-trash" label="Delete" severity="danger" class="me-md-2" />
                            </div>
                            <p-select
                            [options]="provinceCombobox"
                            optionLabel="text"
                            optionValue="value"
                            class="me-lg-2"
                            [style]="{ 'width': '240px' }"
                            (onChange)="onProvinceChange($event.value)" />
                            <p-select
                            [options]="districtCombobox"
                            optionLabel="text"
                            optionValue="value"
                            class="me-lg-2"
                            [style]="{ 'width': '240px' }"
                            (onChange)="onDistrictChange($event.value)" />
                            <p-select
                            [options]="wardCombobox"
                            optionLabel="text"
                            optionValue="value"
                            class="me-lg-2"
                            [style]="{ 'width': '240px' }"
                            (onChange)="onWardChange($event.value)" />
                            <p-iconfield iconPosition="right">
                                <p-inputicon>
                                    <i class="pi pi-search"></i>
                                </p-inputicon>
                                <input pInputText
                                       type="text"
                                       (keyup.enter)="onSearch($event)"
                                       placeholder="Search keyword" />
                            </p-iconfield>
                        </div>
                    </ng-template>
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th class="text-center" style="width: 4rem;" pResizableColumn><p-tableHeaderCheckbox /></th>
                            <th class="text-center" *ngFor="let col of columns" pResizableColumn>
                                {{ col.header }}
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-rowData let-columns="columns">
                        <tr>
                            <td class="text-center">
                                <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
                            </td>
                            <td *ngFor="let col of columns">
                                {{ rowData[col.field] }}
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td [colSpan]="cols.length + 1" class="text-center">No data found.</td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</ng-container>

<!--Dialog-->
<p-dialog header="{{isView ? '' : isEdit ? 'Update' : 'Create'}} Parent {{isView ? 'Detail' : ''}}" styleClass="p-dialog-sm p-dialog-modal" [modal]="true" [(visible)]="visible">
    <form [formGroup]="formGroup" #parentForm="ngForm" (ngSubmit)="saveData()" autocomplete="off">

        <div class="row">
            <label for="firstName" class="col-md-4">First Name</label>
            <input pInputText id="firstName" [formControl]="formGroup.controls.firstName" name="firstName" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('firstName')?.invalid && formGroup.get('firstName')?.touched" class="mt-2 form-group-validator">First name is required.</small>
        </div>

        <div class="row">
            <label for="lastName" class="col-md-4">Last Name</label>
            <input pInputText id="lastName" [formControl]="formGroup.controls.lastName" name="lastName" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('lastName')?.invalid && formGroup.get('lastName')?.touched" class="mt-2 form-group-validator">Last name is required.</small>
        </div>

        <div class="row">
            <label for="phone" class="col-md-4">Phone</label>
            <input pInputText id="phone" [formControl]="formGroup.controls.phone" name="phone" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('phone')?.invalid && formGroup.get('phone')?.touched" class="mt-2 form-group-validator">Phone is required.</small>
        </div>

        <div class="row">
            <label for="email" class="col-md-4">Email</label>
            <input pInputText id="email" [formControl]="formGroup.controls.email" name="email" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched" class="mt-2 form-group-validator">Email is required.</small>
        </div>
        <div class="row">
          <label class="col-md-4">Province</label>
          <p-select
            name="province"
            class="col-md-8"
            [options]="provinceCombobox"
            id="province"
            [formControl]="formGroup.controls.provinceId"
            [appendTo]="'body'"
            optionLabel="text"
            optionValue="value"
            [readonly] = "isView" />
          <small *ngIf="formGroup.get('province')?.invalid && formGroup.get('province')?.touched" class="mt-2 form-group-validator">Province is required.</small>
        </div>
        <div class="row">
          <label class="col-md-4">District</label>
          <p-select
            name="district"
            class="col-md-8"
            [options]="districtCombobox"
            id="district"
            [formControl]="formGroup.controls.districtId"
            [appendTo]="'body'"
            optionLabel="text"
            optionValue="value"
            [readonly] = "isView" />
          <small *ngIf="formGroup.get('district')?.invalid && formGroup.get('district')?.touched" class="mt-2 form-group-validator">District is required.</small>
        </div>
        <div class="row">
          <label class="col-md-4">Ward</label>
          <p-select
            name="ward"
            class="col-md-8"
            [options]="wardCombobox"
            id="ward"
            [formControl]="formGroup.controls.wardId"
            [appendTo]="'body'"
            optionLabel="text"
            optionValue="value"
            [readonly] = "isView" />
          <small *ngIf="formGroup.get('ward')?.invalid && formGroup.get('ward')?.touched" class="mt-2 form-group-validator">Ward is required.</small>
        </div>
        <div class="row">
            <label for="note" class="col-md-4">Note</label>
            <textarea id="note" [formControl]="formGroup.controls.note" name="note" class="col-md-8" [readOnly]="isView" rows="5" cols="30" pTextarea>
</textarea>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
            <p-button [label]="isView ? '' : isEdit ? 'Update' : 'Create'" *ngIf="!isView" type="submit" />
        </div>
    </form>
</p-dialog>
