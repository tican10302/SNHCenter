<ng-container *ngIf="permission?.isView">
    <div>
        <div class="title">
            <h2 class="title-content">
                Shift
            </h2>
        </div>
        <div class="content">
            <div class="">
                <div class="row">
                    <div class="col-md-6">
                    </div>
                </div>
                <p-table #dataTable
                         dataKey="id"
                         [columns]="cols"
                         [value]="tableData"
                         [(selection)]="selectedListData"
                         [paginator]="true"
                         [tableStyle]="{ 'min-width': '50rem' }"
                         [resizableColumns]="true"
                         [rows]="10"
                         [rowsPerPageOptions]="[10, 15, 20]"
                         [totalRecords]="totalRecords"
                         [lazy]="true"
                         [(first)]="getListPagingRequest.offset"
                         showGridlines
                         stripedRows
                         (onPage)="loadData($event)">
                    <ng-template pTemplate="caption">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p-button *ngIf="permission?.isView" (onClick)="showViewDialog()" icon="pi pi-eye" label="View" severity="info" class="me-md-2" />
                                <p-button *ngIf="permission?.isAdd" (onClick)="showAddDialog()" icon="pi pi-plus" label="Add" severity="success" class="me-md-2" />
                                <p-button *ngIf="permission?.isEdit" (onClick)="showEditDialog()" icon="pi pi-pencil" label="Edit" severity="warn" class="me-md-2" />
                                <p-button *ngIf="permission?.isDelete" (onClick)="confirmDelete($event)" icon="pi pi-trash" label="Delete" severity="danger" class="me-md-2" />
                            </div>
                            <p-iconfield iconPosition="right">
                                <p-inputicon>
                                    <i class="pi pi-search"></i>
                                </p-inputicon>
                                <input pInputText
                                       type="text"
                                       (keyup.enter)="onSearch($event)"
                                       placeholder="Search keyword" />
                            </p-iconfield>
                        </div>
                    </ng-template>
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th class="text-center" style="width: 4rem;" pResizableColumn><p-tableHeaderCheckbox /></th>
                            <th *ngFor="let col of columns" pResizableColumn>
                                {{ col.header }}
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-rowData let-columns="columns">
                        <tr>
                            <td class="text-center">
                                <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
                            </td>
                            <td *ngFor="let col of columns">
                                {{ rowData[col.field] }}
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td [colSpan]="cols.length + 1" class="text-center">No data found.</td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</ng-container>

<!--Dialog-->
<p-dialog header="{{isView ? '' : isEdit ? 'Update' : 'Create'}} Shift {{isView ? 'Detail' : ''}}" styleClass="p-dialog-sm p-dialog-modal" [modal]="true" [(visible)]="visible">
    <form [formGroup]="formGroup" #shiftForm="ngForm" (ngSubmit)="saveData()" autocomplete="off">
        <div class="row">
            <label for="name" class="col-md-3">Name</label>
            <input pInputText id="name" [formControl]="formGroup.controls.name" name="name" class="col-md-9" [readOnly]="isView" />
            <small *ngIf="formGroup.get('name')?.invalid && formGroup.get('name')?.touched" class="mt-2 form-group-validator">Name is required.</small>
        </div>

        <div class="row">
            <label class="col-md-3">Time</label>
            <p-datepicker [formControl]="formGroup.controls.time"
                          [iconDisplay]="'input'"
                          [showIcon]="true"
                          [timeOnly]="true"
                          [readonlyInput]="isView"
                          inputId="time"
                          class="col-md-9">
              <ng-template pTemplate="inputicon" let-clickCallBack="clickCallBack">
                <i class="pi pi-clock pointer-events-none" (click)="clickCallBack($event)"></i>
              </ng-template>
            </p-datepicker>
            <small *ngIf="formGroup.get('time')?.invalid && formGroup.get('time')?.touched" class="form-group-validator">Time is required.</small>
        </div>

        <div class="row">
            <label class="col-md-3">Day</label>
            <div class="col-md-9 p-0">
                <div class="d-flex flex-wrap">
                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="monday"
                        name="monday"
                        [formControl]="formGroup.controls.Monday"
                        (onChange)="onCheckboxChangeDay('Monday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Monday</label>
                    </div>

                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="tuesday"
                        name="tuesday"
                        [formControl]="formGroup.controls.Tuesday"
                        (onChange)="onCheckboxChangeDay('Tuesday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Tuesday</label>
                    </div>

                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="wednesday"
                        name="wednesday"
                        [formControl]="formGroup.controls.Wednesday"
                        (onChange)="onCheckboxChangeDay('Wednesday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Wednesday</label>
                    </div>

                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="thursday"
                        name="thursday"
                        [formControl]="formGroup.controls.Thursday"
                        (onChange)="onCheckboxChangeDay('Thursday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Thursday</label>
                    </div>

                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="friday"
                        name="friday"
                        [formControl]="formGroup.controls.Friday"
                        (onChange)="onCheckboxChangeDay('Friday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Friday</label>
                    </div>

                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="saturday"
                        name="saturday"
                        [formControl]="formGroup.controls.Saturday"
                        (onChange)="onCheckboxChangeDay('Saturday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Saturday</label>
                    </div>

                    <div class="d-flex align-items-start me-3">
                      <p-checkbox
                        inputId="sunday"
                        name="sunday"
                        [formControl]="formGroup.controls.Sunday"
                        (onChange)="onCheckboxChangeDay('Sunday')"
                        [binary]="true"
                        [readonly]="isView">
                      </p-checkbox>
                        <label class="ms-2">Sunday</label>
                    </div>
                </div>
            </div>
            <small *ngIf="formGroup.get('day')?.invalid && formGroup.get('day')?.touched" class="mt-2 form-group-validator">Day is required.</small>
        </div>


        <div class="row">
            <label for="note" class="col-md-3">Note</label>
            <textarea id="note" [formControl]="formGroup.controls.note" name="note" class="col-md-9" [readOnly]="isView" rows="5" cols="30" pTextarea>
</textarea>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
            <p-button [label]="isView ? '' : isEdit ? 'Update' : 'Create'" *ngIf="!isView" type="submit" />
        </div>
    </form>
</p-dialog>
