<ng-container *ngIf="permission?.isView">
    <div>
        <div class="title">
            <h2 class="title-content">
                Course
            </h2>
        </div>
        <div class="content">
            <div class="">
                <div class="row">
                    <div class="col-md-6">
                    </div>
                </div>
                <p-table #dataTable
                         dataKey="id"
                         [columns]="cols"
                         [value]="tableData"
                         [(selection)]="selectedListData"
                         [paginator]="true"
                         [tableStyle]="{ 'min-width': '50rem' }"
                         [resizableColumns]="true"
                         [rows]="10"
                         [rowsPerPageOptions]="[10, 15, 20]"
                         [totalRecords]="totalRecords"
                         [lazy]="true"
                         [(first)]="getListPagingRequest.offset"
                         showGridlines
                         stripedRows
                         (onPage)="loadData($event)">
                    <ng-template pTemplate="caption">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="flex-grow-1">
                                <p-button *ngIf="permission?.isView" (onClick)="showViewDialog()" icon="pi pi-eye" label="View" severity="info" class="me-md-2" />
                                <p-button *ngIf="permission?.isAdd" (onClick)="showAddDialog()" icon="pi pi-plus" label="Add" severity="success" class="me-md-2" />
                                <p-button *ngIf="permission?.isEdit" (onClick)="showEditDialog()" icon="pi pi-pencil" label="Edit" severity="warn" class="me-md-2" />
                                <p-button *ngIf="permission?.isDelete" (onClick)="confirmDelete($event)" icon="pi pi-trash" label="Delete" severity="danger" class="me-md-2" />
                            </div>

                            <p-select [options]="levelCombobox"
                                      optionLabel="text"
                                      optionValue="value"
                                      class="me-lg-2"
                                      [style]="{ 'width': '240px' }"
                                      (onChange)="onLevelChange($event.value)" />
                            <p-iconfield iconPosition="right">
                                <p-inputicon>
                                    <i class="pi pi-search"></i>
                                </p-inputicon>
                                <input pInputText
                                       type="text"
                                       (keyup.enter)="onSearch($event)"
                                       placeholder="Search keyword" />
                            </p-iconfield>
                        </div>
                    </ng-template>
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th class="text-center" style="width: 4rem;" pResizableColumn><p-tableHeaderCheckbox /></th>
                            <th class="text-center" *ngFor="let col of columns" pResizableColumn>
                                {{ col.header }}
                            </th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-rowData let-columns="columns">
                        <tr>
                            <td class="text-center">
                                <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
                            </td>
                            <td *ngFor="let col of columns">
                                {{ rowData[col.field] }}
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td [colSpan]="cols.length + 1" class="text-center">No data found.</td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</ng-container>

<!--Dialog-->
<p-dialog header="{{isView ? '' : isEdit ? 'Update' : 'Create'}} Course {{isView ? 'Detail' : ''}}" styleClass="p-dialog-sm p-dialog-modal" [modal]="true" [(visible)]="visible">
    <form [formGroup]="formGroup" #courseForm="ngForm" (ngSubmit)="saveData()" autocomplete="off">
        <div class="row">
            <label for="name" class="col-md-4">Name</label>
            <input pInputText id="name" [formControl]="formGroup.controls.name" name="name" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('name')?.invalid && formGroup.get('name')?.touched" class="mt-2 form-group-validator">Name is required.</small>
        </div>
        <div class="row">
            <label for="startDate" class="col-md-4">Start Day</label>
            <p-datepicker [(ngModel)]="startDate "
                          inputId="startDate"
                          [disabled]="isView"
                          class="col-md-8">
            </p-datepicker>
            <small *ngIf="!startDate && isTouched" class="mt-2 form-group-validator">Start Date is required.</small>
        </div>
        <div class="row">
            <label for="endDate" class="col-md-4">End Day</label>
            <p-datepicker [(ngModel)]="endDate "
                          inputId="endDate"
                          [disabled]="isView"
                          class="col-md-8">
            </p-datepicker>
            <small *ngIf="!endDate && isTouched" class="mt-2 form-group-validator">End Date is required.</small>
        </div>
        <div class="row">
            <label class="col-md-4">Level</label>
            <p-select name="level"
                      class="col-md-8"
                      [options]="levelCombobox"
                      id="program"
                      [formControl]="formGroup.controls.levelId"
                      [appendTo]="'body'"
                      optionLabel="text"
                      optionValue="value"
                      [readonly]="isView" />
            <small *ngIf="formGroup.get('level')?.invalid && formGroup.get('level')?.touched" class="mt-2 form-group-validator">Level is required.</small>
        </div>
        <div class="row">
            <label class="col-md-4">Shift</label>
            <p-select name="shift"
                      class="col-md-8"
                      [options]="shiftCombobox"
                      id="program"
                      [formControl]="formGroup.controls.shiftId"
                      [appendTo]="'body'"
                      optionLabel="text"
                      optionValue="value"
                      [readonly]="isView" />
            <small *ngIf="formGroup.get('shift')?.invalid && formGroup.get('shift')?.touched" class="mt-2 form-group-validator">Shift is required.</small>
        </div>
        <div class="row">
            <label for="room" class="col-md-4">Room</label>
            <input pInputText id="room" [formControl]="formGroup.controls.room" name="room" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('room')?.invalid && formGroup.get('room')?.touched" class="mt-2 form-group-validator">Room is required.</small>
        </div>
        <div class="row">
            <label for="center" class="col-md-4">Center</label>
            <input pInputText id="center" [formControl]="formGroup.controls.center" name="center" class="col-md-8" [readOnly]="isView" />
            <small *ngIf="formGroup.get('center')?.invalid && formGroup.get('center')?.touched" class="mt-2 form-group-validator">Center is required.</small>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
            <p-button [label]="isView ? '' : isEdit ? 'Update' : 'Create'" *ngIf="!isView" type="submit" />
        </div>
    </form>
</p-dialog>
